<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>KOMATSU RUN — Pixel Terrain Runner</title>
<style>
  :root{
    --steel-0:#0d1015;
    --steel-1:#161b22;
    --steel-2:#222a33;
    --line:#333d49;
    --kom-yellow:#ffc220;
    --kom-yellow-d:#c98a10;
    --txt:#c9d3de;
    --txt-dim:#7d8a99;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:
      radial-gradient(1200px 700px at 50% -10%, #1e2733 0%, #0d1015 60%),
      var(--steel-0);
    color:var(--txt);
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Courier New",monospace;
    display:flex;align-items:center;justify-content:center;
    padding:14px;gap:22px;
    overflow:hidden;
    -webkit-tap-highlight-color:transparent;
    user-select:none;-webkit-user-select:none;
  }
  /* subtle hazard-stripe edges, construction vibe */
  body::before,body::after{
    content:"";position:fixed;left:0;right:0;height:6px;z-index:5;
    background:repeating-linear-gradient(135deg,var(--kom-yellow) 0 12px,#12161c 12px 24px);
    opacity:.5;
  }
  body::before{top:0}
  body::after{bottom:0}

  .machine{
    position:relative;
    padding:14px;
    border-radius:14px;
    background:linear-gradient(180deg,var(--steel-2),var(--steel-1));
    border:1px solid var(--line);
    box-shadow:0 30px 70px rgba(0,0,0,.65), inset 0 1px 0 rgba(255,255,255,.06);
  }
  .bezel{
    border-radius:8px;
    padding:8px;
    background:#0a0d11;
    border:1px solid #000;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.04), inset 0 6px 22px rgba(0,0,0,.9);
  }
  canvas{
    display:block;
    height:min(78vh, 620px);
    width:auto;
    aspect-ratio:320/480;
    image-rendering:pixelated;
    image-rendering:crisp-edges;
    border-radius:3px;
    cursor:pointer;
    touch-action:manipulation;
  }
  .plate{
    display:flex;align-items:center;justify-content:space-between;
    gap:12px;margin:0 2px 10px;
  }
  .badge{
    font-weight:700;letter-spacing:.14em;font-size:12px;
    color:#0d1015;background:var(--kom-yellow);
    padding:3px 8px;border-radius:3px;
    box-shadow:0 2px 0 var(--kom-yellow-d);
  }
  .plate .sub{font-size:10px;letter-spacing:.18em;color:var(--txt-dim);text-transform:uppercase}
  .bolts{display:flex;gap:5px}
  .bolt{width:7px;height:7px;border-radius:50%;background:#0f1318;box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}

  aside{
    width:230px;font-size:11px;line-height:1.65;color:var(--txt-dim);
  }
  aside h1{
    font-size:13px;letter-spacing:.16em;color:var(--txt);
    text-transform:uppercase;margin-bottom:10px;
  }
  aside .row{
    display:flex;justify-content:space-between;gap:10px;
    padding:5px 0;border-bottom:1px dashed #232c36;
  }
  aside .row b{color:var(--kom-yellow);font-weight:600}
  aside p{margin-top:12px}
  @media (max-width:820px){ aside{display:none} body{padding:10px} canvas{height:min(80vh,700px)} }
</style>
</head>
<body>

<div class="machine">
  <div class="plate">
    <span class="badge">KOMATSU</span>
    <span class="sub">Terrain Runner</span>
    <span class="bolts"><i class="bolt"></i><i class="bolt"></i><i class="bolt"></i></span>
  </div>
  <div class="bezel"><canvas id="game" width="320" height="480"></canvas></div>
</div>

<aside>
  <h1>Operator Manual</h1>
  <div class="row"><span>Lift / Flap</span><b>SPACE</b></div>
  <div class="row"><span>Alt. control</span><b>CLICK / TAP</b></div>
  <div class="row"><span>Pause</span><b>P</b></div>
  <div class="row"><span>Restart</span><b>R</b></div>
  <p>Keep the dozer between the mossy pillars above and the tree-topped hills below. Terrain speed and gap tolerance tighten every few pillars.</p>
</aside>

<script>
(() => {
"use strict";

/* ══════════════════════════════════════════════════════════════
   KOMATSU RUN — self-contained pixel-art terrain runner
   Everything renders on a 320×480 logical buffer, upscaled by
   CSS with nearest-neighbour filtering for a crisp pixel look.
   ══════════════════════════════════════════════════════════════ */

const W = 320, H = 480;
const GROUND_Y = 424;                  // top edge of the ground strip
const cvs = document.getElementById("game");
const ctx = cvs.getContext("2d", { alpha:false });
ctx.imageSmoothingEnabled = false;

/* ── Palette ─────────────────────────────────────────────── */
const P = {
  skyTop:"#7ec8f2", skyMid:"#a6dcf5", skyLow:"#cfeaf7", skyHaze:"#e6f3f2",
  sun:"#fff3c4", sunCore:"#ffffff",
  cloud:"#ffffff", cloudShade:"#d6e9f5",
  farHill:"#8fb7a6", farHillD:"#7aa694",
  midHill:"#5f9b6d", midHillD:"#4e8459",
  ink:"#1b1b22",
  grass:"#57ad3f", grassD:"#3d8a2c", grassL:"#79c95a",
  dirt:"#9a6636", dirtD:"#7a4d27", dirtL:"#b8804a",
  rock:"#7b828f", rockD:"#5f6673", rockL:"#98a0ac", rockH:"#b3bac5",
  moss:"#4e9a3e", mossD:"#3a7a2c",
  leaf:"#3f8f34", leafD:"#2e6f27", leafL:"#5db24a",
  trunk:"#6b4526", trunkD:"#4e321b",
  yellow:"#ffc220", yellowD:"#c98a10", yellowL:"#ffdc6a",
  smoke:"#d8dde3", dust:"#c9a374",
  ui:"#ffffff", uiDim:"#c8d2dc", uiInk:"#12161c"
};

/* ── Pixel-crisp bitmap text ──────────────────────────────────
   Text is rasterised at 8px then alpha-thresholded, so upscaling
   yields hard pixel edges instead of blurry glyphs.            */
const textCache = new Map();
function textCanvas(str, color){
  const key = str + "|" + color;
  if (textCache.has(key)) return textCache.get(key);
  const m = document.createElement("canvas").getContext("2d");
  m.font = 'bold 8px "Courier New",Courier,monospace';
  const w = Math.max(1, Math.ceil(m.measureText(str).width)) + 2;
  const h = 10;
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  const g = c.getContext("2d");
  g.font = 'bold 8px "Courier New",Courier,monospace';
  g.textBaseline = "top";
  g.fillStyle = "#000";
  g.fillText(str, 1, 1);
  const img = g.getImageData(0,0,w,h), d = img.data;
  const rgb = hexToRgb(color);
  for (let i = 0; i < d.length; i += 4){
    if (d[i+3] > 110){ d[i]=rgb[0]; d[i+1]=rgb[1]; d[i+2]=rgb[2]; d[i+3]=255; }
    else { d[i+3] = 0; }
  }
  g.putImageData(img, 0, 0);
  textCache.set(key, c);
  return c;
}
function hexToRgb(h){
  return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
}
/* align: -1 left, 0 centre, 1 right */
function text(str, x, y, scale=1, color=P.ui, align=0, shadow=true){
  str = String(str).toUpperCase();
  const c = textCanvas(str, color);
  const w = c.width * scale, h = c.height * scale;
  const px = Math.round(align === 0 ? x - w/2 : align === 1 ? x - w : x);
  const py = Math.round(y);
  if (shadow){
    const s = textCanvas(str, P.uiInk);
    ctx.globalAlpha = .55;
    ctx.drawImage(s, px, py + scale, w, h);
    ctx.globalAlpha = 1;
  }
  ctx.drawImage(c, px, py, w, h);
  return w;
}

/* ── Low-level pixel helpers ─────────────────────────────── */
const R = (x,y,w,h,col) => { ctx.fillStyle = col; ctx.fillRect(x|0, y|0, Math.max(0,w|0), Math.max(0,h|0)); };
function pixelCircle(g, cx, cy, r, col){
  g.fillStyle = col;
  for (let y = -r; y <= r; y++){
    const half = Math.floor(Math.sqrt(Math.max(0, r*r - y*y)) + .5);
    if (half > 0) g.fillRect(Math.round(cx-half), Math.round(cy+y), half*2, 1);
  }
}

/* Deterministic per-obstacle randomness so terrain never flickers */
function hash(n){ const s = Math.sin(n * 127.1) * 43758.5453; return s - Math.floor(s); }

/* ══════════════════════════════════════════════════════════
   SPRITE: the dozer/tractor, pre-rendered to offscreen frames
   ══════════════════════════════════════════════════════════ */
const BODY = [
  "..............KK..............",
  "..............KK..............",
  ".....KKKKKKK..KK..............",
  ".....KWWWWWK..KK..............",
  ".....KWWWWWK.KKKK.............",
  ".....KWWWWWK.KYYYYYYYYYK......",
  ".....KWWWWWKKKYYYYYYYYYYK.....",
  "....KKYYYYYYYYYYYYYYYYYYK.....",
  "....KYYYYYYYYYYYYYYYYYYYK.....",
  "....KYYYYYYYYYYYYYYYYYYYK.....",
  "....KYYYYYYYYYYYYYYYYYYYK.....",
  "....KDDDDDDDDDDDDDDDDDDDK.....",
  "....KKKKKKKKKKKKKKKKKKKKK....."
];
const SPR = { K:P.ink, Y:P.yellow, D:P.yellowD, W:"#bfe9ff" };

const TW = 32, TH = 26;               // sprite frame size
const WHEEL_FRAMES = 8;
const tractorFrames = [];

function drawWheel(g, cx, cy, r, ang){
  pixelCircle(g, cx, cy, r, P.ink);                 // tyre
  pixelCircle(g, cx, cy, r-1, "#2c2c36");
  pixelCircle(g, cx, cy, Math.max(1, r-3), "#8f96a3"); // rim
  pixelCircle(g, cx, cy, Math.max(1, r-4), "#b9c0cb");
  g.fillStyle = P.ink;
  // rotating tread lugs
  const lugs = r > 5 ? 8 : 6;
  for (let i = 0; i < lugs; i++){
    const a = ang + (i * Math.PI * 2) / lugs;
    g.fillRect(Math.round(cx + Math.cos(a)*(r-1.2)) - 1, Math.round(cy + Math.sin(a)*(r-1.2)) - 1, 2, 2);
  }
  // hub
  g.fillStyle = P.yellowD;
  g.fillRect(Math.round(cx)-1, Math.round(cy)-1, 2, 2);
}

function buildTractorFrames(){
  for (let f = 0; f < WHEEL_FRAMES; f++){
    const c = document.createElement("canvas");
    c.width = TW; c.height = TH;
    const g = c.getContext("2d");
    g.imageSmoothingEnabled = false;
    const ang = (f / WHEEL_FRAMES) * Math.PI * 2;

    // wheels sit behind the chassis
    drawWheel(g, 9, 18, 7, ang);          // rear drive wheel (big)
    drawWheel(g, 24, 20, 5, ang * 1.4);   // front steer wheel (small)

    // body
    for (let y = 0; y < BODY.length; y++){
      const row = BODY[y];
      for (let x = 0; x < row.length; x++){
        const col = SPR[row[x]];
        if (col){ g.fillStyle = col; g.fillRect(x + 1, y, 1, 1); }
      }
    }
    // decals + details
    g.fillStyle = P.yellowL; g.fillRect(15, 8, 9, 1);          // hood highlight
    g.fillStyle = "#2b6fb5"; g.fillRect(15, 10, 8, 1);         // brand stripe
    g.fillStyle = "#ffffff"; g.fillRect(6, 4, 4, 1);           // cab glass glint
    g.fillStyle = P.ink;    g.fillRect(24, 7, 1, 4);           // grille edge
    g.fillStyle = "#3a3a46"; g.fillRect(25, 8, 1, 3);          // headlight housing
    g.fillStyle = "#ffe9a3"; g.fillRect(26, 9, 1, 2);          // headlight
    // exhaust cap
    g.fillStyle = "#3a3a46"; g.fillRect(14, 0, 3, 1);
    tractorFrames.push(c);
  }
}
buildTractorFrames();

/* ══════════════════════════════════════════════════════════
   AUDIO — tiny WebAudio blips, no assets
   ══════════════════════════════════════════════════════════ */
let actx = null, muted = false;
function beep(freq, dur = .08, type = "square", vol = .05, slide = 0){
  if (muted) return;
  try{
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, actx.currentTime);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), actx.currentTime + dur);
    g.gain.setValueAtTime(vol, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001, actx.currentTime + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + dur + .02);
  }catch(e){/* audio is optional */}
}

/* ══════════════════════════════════════════════════════════
   GAME STATE
   ══════════════════════════════════════════════════════════ */
const PW = 54;                       // obstacle width
const SPACING = 158;                 // horizontal distance between obstacles
const BASE_SPEED = 1.65;
const GRAVITY = 0.42;
const LIFT = -6.2;

const S = { MENU:0, PLAY:1, DEAD:2, PAUSE:3 };
let state = S.MENU;

const kom = { x:78, y:210, vy:0, rot:0 };
let obstacles = [], particles = [], clouds = [];
let score = 0, best = 0, scroll = 0, speed = BASE_SPEED, shake = 0, tick = 0;
let flash = 0, deadTimer = 0, spawnX = 0;

try { best = parseInt(localStorage.getItem("komatsu_run_best") || "0", 10) || 0; } catch(e){}

function gapSize(){ return Math.max(104, 132 - score * 1.4); }
function currentSpeed(){ return Math.min(3.0, BASE_SPEED + score * 0.035); }

function seedClouds(){
  clouds = [];
  for (let i = 0; i < 5; i++){
    clouds.push({ x:Math.random()*W, y:26 + Math.random()*120, s:.4 + Math.random()*.5, w:14 + ((Math.random()*10)|0) });
  }
}
function reset(){
  obstacles = []; particles = [];
  kom.x = 78; kom.y = 210; kom.vy = 0; kom.rot = 0;
  score = 0; speed = BASE_SPEED; shake = 0; flash = 0; deadTimer = 0;
  spawnX = W + 60;
  for (let i = 0; i < 3; i++) spawnObstacle(spawnX + i * SPACING);
  spawnX += 2 * SPACING;
}
function spawnObstacle(x){
  const gap = gapSize();
  const minTop = 58, maxTop = GROUND_Y - gap - 74;
  const gapY = minTop + Math.random() * Math.max(20, maxTop - minTop);
  obstacles.push({ x, gapY, gap, scored:false, seed:Math.random()*1000 });
}
seedClouds();
reset();

/* ── Input ───────────────────────────────────────────────── */
function flap(){
  if (state === S.MENU){ state = S.PLAY; reset(); state = S.PLAY; }
  if (state === S.PAUSE) return;
  if (state === S.DEAD){ if (deadTimer > 40){ state = S.MENU; reset(); } return; }
  kom.vy = LIFT;
  beep(420, .06, "square", .045, 180);
  for (let i = 0; i < 5; i++){
    particles.push({
      x:kom.x - 1, y:kom.y - 11, vx:-.7 - Math.random()*.9, vy:-.5 - Math.random()*.7,
      life:22 + Math.random()*16, r:1 + Math.random()*2, c:P.smoke, a:.85
    });
  }
}
function press(e){
  if (e && e.type === "keydown"){
    const k = e.key.toLowerCase();
    if (k === "p"){ if (state === S.PLAY) state = S.PAUSE; else if (state === S.PAUSE) state = S.PLAY; return; }
    if (k === "m"){ muted = !muted; return; }
    if (k === "r"){ state = S.MENU; reset(); return; }
    if (e.code !== "Space" && k !== "arrowup" && k !== "w" && k !== "enter") return;
    e.preventDefault();
  }
  flap();
}
window.addEventListener("keydown", press, { passive:false });
cvs.addEventListener("pointerdown", (e) => { e.preventDefault(); flap(); });
window.addEventListener("blur", () => { if (state === S.PLAY) state = S.PAUSE; });

/* ══════════════════════════════════════════════════════════
   UPDATE
   ══════════════════════════════════════════════════════════ */
function update(){
  tick++;
  if (flash > 0) flash--;
  if (shake > 0) shake *= .86;

  // clouds always drift
  for (const c of clouds){
    c.x -= c.s * .28;
    if (c.x < -40){ c.x = W + 20; c.y = 20 + Math.random()*130; }
  }

  if (state === S.MENU){
    kom.y = 210 + Math.sin(tick * .07) * 7;
    kom.rot = Math.sin(tick * .07) * .06;
    scroll += BASE_SPEED * .6;
    if (tick % 14 === 0) particles.push({ x:kom.x-1, y:kom.y-11, vx:-.5, vy:-.5, life:26, r:1.5, c:P.smoke, a:.6 });
  }

  if (state === S.PLAY){
    speed = currentSpeed();
    scroll += speed;

    kom.vy = Math.min(kom.vy + GRAVITY, 9.4);
    kom.y += kom.vy;
    const target = Math.max(-.42, Math.min(1.05, kom.vy * .075));
    kom.rot += (target - kom.rot) * .18;

    // obstacles
    for (const o of obstacles) o.x -= speed;
    while (obstacles.length && obstacles[0].x + PW < -20) obstacles.shift();
    if (obstacles.length === 0 || obstacles[obstacles.length-1].x < W - SPACING) {
      spawnObstacle(W + 30);
    }

    // scoring
    for (const o of obstacles){
      if (!o.scored && o.x + PW < kom.x - 10){
        o.scored = true; score++;
        beep(660 + Math.min(score,12)*18, .07, "square", .05, 120);
        flash = 4;
      }
    }

    // exhaust idle puffs + wheel dust
    if (tick % 10 === 0)
      particles.push({ x:kom.x-1, y:kom.y-11, vx:-speed*.4, vy:-.45, life:24, r:1.4, c:P.smoke, a:.5 });

    // collisions ─ hitbox is inset from the sprite for fairness
    const hb = { x:kom.x - 12, y:kom.y - 8, w:23, h:17 };
    let hit = false;
    if (hb.y + hb.h >= GROUND_Y){ hit = true; kom.y = GROUND_Y - 8 - hb.h + 8; }
    if (hb.y < -6) { kom.y = 2; kom.vy = 0; }
    for (const o of obstacles){
      if (hb.x + hb.w < o.x || hb.x > o.x + PW) continue;
      const topH = o.gapY, botY = o.gapY + o.gap;
      if (hb.y < topH || hb.y + hb.h > botY){ hit = true; break; }
    }
    if (hit) die();
  }

  if (state === S.DEAD){
    deadTimer++;
    kom.vy = Math.min(kom.vy + GRAVITY * 1.1, 10);
    kom.y += kom.vy;
    kom.rot = Math.min(kom.rot + .07, 1.4);
    if (kom.y > GROUND_Y - 8){ kom.y = GROUND_Y - 8; kom.vy = 0; kom.rot = Math.min(kom.rot, 1.15); }
  }

  // particles
  for (let i = particles.length - 1; i >= 0; i--){
    const p = particles[i];
    p.x += p.vx; p.y += p.vy; p.vy *= .97; p.vx *= .99; p.life--;
    p.r += .035;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function die(){
  if (state !== S.PLAY) return;
  state = S.DEAD; deadTimer = 0; shake = 9; flash = 8;
  kom.vy = -3.2;
  beep(180, .18, "sawtooth", .06, -120);
  setTimeout(() => beep(90, .3, "sawtooth", .05, -50), 90);
  for (let i = 0; i < 22; i++){
    particles.push({
      x:kom.x, y:kom.y, vx:-2 + Math.random()*4, vy:-2.4 + Math.random()*2,
      life:26 + Math.random()*22, r:1 + Math.random()*2.4,
      c: Math.random() < .5 ? P.dust : P.smoke, a:.9
    });
  }
  if (score > best){
    best = score;
    try { localStorage.setItem("komatsu_run_best", String(best)); } catch(e){}
  }
}

/* ══════════════════════════════════════════════════════════
   RENDER
   ══════════════════════════════════════════════════════════ */
function drawSky(){
  R(0, 0, W, 120, P.skyTop);
  R(0, 120, W, 90, P.skyMid);
  R(0, 210, W, 110, P.skyLow);
  R(0, 320, W, GROUND_Y - 320, P.skyHaze);
  // dithered banding between sky layers for a retro gradient
  for (let x = 0; x < W; x += 2){
    R(x, 118, 1, 2, P.skyMid); R(x + 1, 208, 1, 2, P.skyLow); R(x, 318, 1, 2, P.skyHaze);
  }
  // sun
  pixelCircle(ctx, 258, 56, 16, "#ffe9a8");
  pixelCircle(ctx, 258, 56, 12, P.sun);
  pixelCircle(ctx, 258, 56, 7, P.sunCore);
}
function drawCloud(c){
  const x = Math.round(c.x), y = Math.round(c.y), w = c.w;
  R(x, y, w, 5, P.cloud);
  R(x + 4, y - 4, w - 9, 4, P.cloud);
  R(x + 9, y - 7, 7, 3, P.cloud);
  R(x - 3, y + 3, w + 6, 4, P.cloud);
  R(x - 3, y + 6, w + 6, 2, P.cloudShade);
}
function drawParallax(){
  // far ridge line
  const off1 = (scroll * .18) % 96;
  ctx.fillStyle = P.farHill;
  for (let i = -1; i < W / 96 + 2; i++){
    const bx = i * 96 - off1;
    for (let x = 0; x < 96; x++){
      const t = x / 96;
      const h = 34 + Math.sin(t * Math.PI) * 40 + Math.sin(t * Math.PI * 3) * 7;
      R(bx + x, GROUND_Y - 46 - h, 1, h + 46, P.farHill);
      R(bx + x, GROUND_Y - 46 - h, 1, 2, "#a3c6b6");
    }
  }
  // mid tree line
  const off2 = (scroll * .42) % 64;
  for (let i = -1; i < W / 64 + 2; i++){
    const bx = i * 64 - off2;
    for (let x = 0; x < 64; x++){
      const t = x / 64;
      const h = 22 + Math.sin(t * Math.PI * 2) * 14 + Math.sin(t * 11) * 4;
      R(bx + x, GROUND_Y - 26 - h, 1, h + 26, P.midHill);
    }
    // pine silhouettes on the ridge
    for (let k = 0; k < 4; k++){
      const tx = bx + 8 + k * 16, base = GROUND_Y - 34 - Math.abs(Math.sin(k * 2.3) * 10);
      R(tx, base - 12, 2, 12, P.midHillD);
      for (let j = 0; j < 4; j++) R(tx - 3 + (j % 2), base - 12 - j * 3, 8 - j, 3, P.midHillD);
    }
  }
}

function drawTree(x, baseY, h, seed){
  // trunk
  R(x - 1, baseY - h, 3, h, P.trunk);
  R(x - 1, baseY - h, 1, h, P.trunkD);
  // canopy: three stacked pixel blobs
  const r = 5 + ((seed * 3) % 2);
  pixelCircle(ctx, x, baseY - h - 2, r + 1, P.leafD);
  pixelCircle(ctx, x, baseY - h - 3, r, P.leaf);
  pixelCircle(ctx, x - 2, baseY - h - 5, r - 2, P.leafL);
  pixelCircle(ctx, x + 3, baseY - h + 1, r - 2, P.leaf);
  R(x - 1, baseY - h - r - 3, 2, 1, P.leafL);
}

function drawBush(x, y, w){
  R(x, y - 3, w, 3, P.leafD);
  R(x + 1, y - 5, w - 2, 2, P.leaf);
  R(x + 2, y - 6, w - 5, 1, P.leafL);
}

/* Bottom obstacle: an earth mound capped with grass and trees */
function drawHill(o){
  const x = Math.round(o.x), top = Math.round(o.gapY + o.gap), h = GROUND_Y - top;
  if (h <= 0) return;
  // rounded shoulders
  R(x + 3, top,     PW - 6, 2, P.ink);
  R(x + 1, top + 2, PW - 2, 2, P.ink);
  R(x,     top + 4, PW,     h - 4, P.ink);
  // grass cap
  R(x + 4, top + 1, PW - 8, 2, P.grassL);
  R(x + 2, top + 3, PW - 4, 3, P.grass);
  R(x + 1, top + 6, PW - 2, 3, P.grassD);
  // dirt body with strata + speckles
  R(x + 1, top + 9, PW - 2, h - 10, P.dirt);
  R(x + 1, top + 9, 2, h - 10, P.dirtD);
  R(x + PW - 3, top + 9, 2, h - 10, P.dirtD);
  R(x + 4, top + 9, 2, h - 10, P.dirtL);
  for (let i = 0; i < 16; i++){
    const rx = x + 4 + Math.floor(hash(o.seed + i) * (PW - 10));
    const ry = top + 13 + Math.floor(hash(o.seed + i * 7.7) * Math.max(1, h - 20));
    if (ry < GROUND_Y - 2) R(rx, ry, 2, 1, hash(o.seed + i * 3.1) > .55 ? P.dirtD : P.dirtL);
  }
  // grass blades hanging over the edge
  for (let i = 0; i < 8; i++){
    const gx = x + 3 + i * 6;
    R(gx, top + 6, 1, 2 + ((i + (o.seed | 0)) % 3), P.grassD);
  }
  // trees, tucked so canopies stay inside the hitbox
  const n = 2 + (Math.floor(hash(o.seed) * 2));
  for (let i = 0; i < n; i++){
    const tx = x + 10 + i * Math.floor((PW - 20) / Math.max(1, n - 1 || 1));
    const th = 8 + Math.floor(hash(o.seed + i * 5) * 6);
    if (top + 10 + th < GROUND_Y) drawTree(tx, top + 12 + th, th, o.seed + i);
  }
  drawBush(x + 5, GROUND_Y - 2, 10);
  drawBush(x + PW - 16, GROUND_Y - 2, 11);
}

/* Top obstacle: mossy stone pillar with a capstone ledge */
function drawPillar(o){
  const x = Math.round(o.x), h = Math.round(o.gapY);
  if (h <= 0) return;
  const ledgeH = 9, ledgeY = h - ledgeH;
  // shaft
  R(x, 0, PW, h, P.ink);
  R(x + 1, 0, PW - 2, h - 1, P.rock);
  R(x + 1, 0, 3, h - 1, P.rockL);
  R(x + PW - 4, 0, 3, h - 1, P.rockD);
  // brick courses
  for (let y = 4; y < ledgeY; y += 9){
    R(x + 1, y, PW - 2, 1, P.rockD);
    const stag = (Math.floor(y / 9) % 2) ? 0 : Math.floor(PW / 2) - 8;
    R(x + 12 + stag, y - 8, 1, 8, P.rockD);
    R(x + 13 + stag, y - 8, 1, 8, P.rockH);
    R(x + 2, y + 1, PW - 4, 1, P.rockH);
  }
  // moss patches, seeded per pillar
  for (let i = 0; i < 9; i++){
    const mx = x + 2 + Math.floor(hash(o.seed + i * 2.3) * (PW - 10));
    const my = Math.floor(hash(o.seed + i * 4.1) * Math.max(1, ledgeY - 8));
    R(mx, my, 4 + (i % 3), 2, i % 2 ? P.moss : P.mossD);
    R(mx + 1, my + 2, 3, 1, P.mossD);
  }
  // capstone ledge (wider, part of the hitbox visually)
  R(x - 3, ledgeY, PW + 6, ledgeH, P.ink);
  R(x - 2, ledgeY + 1, PW + 4, ledgeH - 2, P.rock);
  R(x - 2, ledgeY + 1, PW + 4, 2, P.rockH);
  R(x - 2, ledgeY + ledgeH - 3, PW + 4, 2, P.rockD);
  // greenery crown spilling over the ledge, kept above the gap
  R(x - 2, ledgeY - 5, PW + 4, 5, P.mossD);
  R(x - 1, ledgeY - 7, PW + 2, 3, P.moss);
  for (let i = 0; i < 7; i++){
    const vx = x - 2 + i * 9 + Math.floor(hash(o.seed + i) * 3);
    const vl = 2 + Math.floor(hash(o.seed + i * 9.3) * 4);
    R(vx, ledgeY - 9, 3, 3, P.leaf);
    R(vx + 1, ledgeY - 9 - vl, 1, vl, P.mossD);
    R(vx, ledgeY - 10 - vl, 3, 2, P.leafL);
  }
}

function drawGround(){
  const off = Math.floor(scroll) % 16;
  R(0, GROUND_Y, W, H - GROUND_Y, P.ink);
  R(0, GROUND_Y + 1, W, 5, P.grass);
  R(0, GROUND_Y + 1, W, 2, P.grassL);
  R(0, GROUND_Y + 6, W, 3, P.grassD);
  R(0, GROUND_Y + 9, W, H - GROUND_Y - 9, P.dirt);
  R(0, GROUND_Y + 9, W, 2, P.dirtL);
  // scrolling track marks
  for (let x = -off; x < W; x += 16){
    R(x, GROUND_Y + 14, 9, 2, P.dirtD);
    R(x + 4, GROUND_Y + 20, 7, 2, P.dirtD);
    R(x + 2, GROUND_Y + 27, 10, 2, P.dirtD);
    R(x + 6, GROUND_Y + 34, 6, 2, P.dirtD);
    R(x + 1, GROUND_Y + 41, 8, 2, P.dirtD);
  }
  for (let x = -off; x < W; x += 16) R(x + 11, GROUND_Y + 17, 2, 1, P.dirtL);
}

function drawTractor(){
  const frame = tractorFrames[Math.floor(scroll * .35) % WHEEL_FRAMES];
  ctx.save();
  ctx.translate(Math.round(kom.x), Math.round(kom.y));
  ctx.rotate(kom.rot);
  ctx.imageSmoothingEnabled = false;
  // ground shadow
  ctx.restore();
  const sh = Math.max(0, 1 - (GROUND_Y - kom.y) / 260);
  ctx.globalAlpha = .18 * sh + .06;
  R(kom.x - 13, GROUND_Y + 3, 26, 3, "#000000");
  ctx.globalAlpha = 1;

  ctx.save();
  ctx.translate(Math.round(kom.x), Math.round(kom.y));
  ctx.rotate(kom.rot);
  ctx.drawImage(frame, -TW / 2 - 2, -TH / 2 - 1);
  ctx.restore();
}

function drawParticles(){
  for (const p of particles){
    const a = Math.max(0, Math.min(1, (p.life / 30) * (p.a ?? .8)));
    ctx.globalAlpha = a;
    const r = Math.max(1, Math.round(p.r));
    R(Math.round(p.x) - r, Math.round(p.y) - r, r * 2, r * 2, p.c);
    ctx.globalAlpha = 1;
  }
}

function panel(x, y, w, h){
  R(x - 2, y - 2, w + 4, h + 4, P.ink);
  R(x, y, w, h, "#1f2a35");
  R(x, y, w, 2, "#33404e");
  R(x, y + h - 2, w, 2, "#141c24");
  // corner rivets
  R(x + 2, y + 2, 2, 2, P.yellow); R(x + w - 4, y + 2, 2, 2, P.yellow);
  R(x + 2, y + h - 4, 2, 2, P.yellow); R(x + w - 4, y + h - 4, 2, 2, P.yellow);
}

function drawHUD(){
  if (state === S.PLAY || state === S.DEAD || state === S.PAUSE){
    text(String(score), W / 2, 26, 4, P.ui, 0, true);
  }
  if (state === S.MENU){
    // title plate
    panel(38, 96, 244, 62);
    R(38, 96, 244, 4, P.yellow);
    text("KOMATSU", W / 2, 108, 3, P.yellow, 0, true);
    text("TERRAIN RUNNER", W / 2, 136, 2, P.uiDim, 0, true);

    text("TAP / SPACE TO LIFT", W / 2, 292 + Math.sin(tick * .09) * 2, 2, P.ui, 0, true);
    text("MIND THE PILLARS AND THE HILLS", W / 2, 316, 1, P.uiDim, 0, true);
    if (best > 0) text("BEST " + best, W / 2, 336, 1, P.yellowL, 0, true);
  }
  if (state === S.PAUSE){
    ctx.globalAlpha = .55; R(0, 0, W, H, "#0b1016"); ctx.globalAlpha = 1;
    text("PAUSED", W / 2, 214, 3, P.ui, 0, true);
    text("PRESS P TO RESUME", W / 2, 246, 1, P.uiDim, 0, true);
  }
  if (state === S.DEAD && deadTimer > 12){
    ctx.globalAlpha = .45; R(0, 0, W, H, "#0b1016"); ctx.globalAlpha = 1;
    panel(50, 150, 220, 130);
    R(50, 150, 220, 4, P.yellow);
    text("MACHINE DOWN", W / 2, 164, 2, P.yellow, 0, true);
    text("SCORE", W / 2 - 46, 200, 1, P.uiDim, 0, true);
    text("BEST", W / 2 + 46, 200, 1, P.uiDim, 0, true);
    text(String(score), W / 2 - 46, 214, 3, P.ui, 0, true);
    text(String(best), W / 2 + 46, 214, 3, P.ui, 0, true);
    R(60, 250, 200, 1, "#33404e");
    if (score >= best && score > 0) text("NEW RECORD", W / 2, 256, 1, P.yellowL, 0, true);
    if (deadTimer > 40) text("TAP TO RESTART", W / 2, 300 + Math.sin(tick * .1) * 2, 2, P.ui, 0, true);
  }
  // subtle scanlines for CRT feel
  ctx.globalAlpha = .05;
  ctx.fillStyle = "#000000";
  for (let y = 0; y < H; y += 3) ctx.fillRect(0, y, W, 1);
  ctx.globalAlpha = 1;
  // vignette corners
  ctx.globalAlpha = .10;
  R(0, 0, W, 4, "#000"); R(0, H - 4, W, 4, "#000"); R(0, 0, 4, H, "#000"); R(W - 4, 0, 4, H, "#000");
  ctx.globalAlpha = 1;
}

function render(){
  const sx = shake > .4 ? (Math.random() * 2 - 1) * shake : 0;
  const sy = shake > .4 ? (Math.random() * 2 - 1) * shake : 0;
  ctx.setTransform(1, 0, 0, 1, Math.round(sx), Math.round(sy));

  drawSky();
  for (const c of clouds) drawCloud(c);
  drawParallax();

  for (const o of obstacles){ drawPillar(o); drawHill(o); }

  drawGround();
  drawParticles();
  drawTractor();

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (flash > 0){ ctx.globalAlpha = flash / 26; R(0, 0, W, H, "#ffffff"); ctx.globalAlpha = 1; }
  drawHUD();
}

/* ── Fixed-timestep loop ─────────────────────────────────── */
let last = performance.now(), acc = 0;
const STEP = 1000 / 60;
function loop(now){
  acc += Math.min(now - last, 250);
  last = now;
  while (acc >= STEP){ update(); acc -= STEP; }
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

})();
</script>
</body>
